services:
  local-llm:
    image: ghcr.io/ggml-org/llama.cpp:server
    command:
      - "-hf"
      - "Qwen/Qwen3-4B-GGUF:Q4_K_M"
      - "--alias"
      - "Qwen3-4B-GGUF"
      - "--host"
      - "0.0.0.0"
      - "--port"
      - "8080"
      - "-c"
      - "4096"
      - "-np"
      - "1"
    ports:
      - "127.0.0.1:8081:8080"
    volumes:
      - local-llm-cache:/root/.cache
    restart: unless-stopped
    init: true
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1:8080/health"]
      interval: 10s
      timeout: 5s
      retries: 60
      start_period: 10m

  careerpilot:
    build:
      context: .
      dockerfile: Dockerfile
    image: careerpilot:local
    env_file:
      - path: .env.production
        required: true
    environment:
      CAREERPILOT_ENVIRONMENT: production
      CAREERPILOT_FRONTEND_DIST_PATH: /app/frontend/dist
      CAREERPILOT_MODEL_BASE_URL: http://local-llm:8080/v1
      CAREERPILOT_MODEL_API_KEY: local-open-source
      CAREERPILOT_MODEL_NAME: Qwen3-4B-GGUF
      CAREERPILOT_RAG_DB_PATH: /app/data/rag/careerpilot.db
      CAREERPILOT_MEMORY_DB_PATH: /app/data/memory/careerpilot.db
      CAREERPILOT_SESSION_DB_PATH: /app/data/sessions/careerpilot.db
      CAREERPILOT_PRODUCT_DB_PATH: /app/data/product/careerpilot.db
      CAREERPILOT_ACTION_DB_PATH: /app/data/actions/careerpilot.db
    depends_on:
      local-llm:
        condition: service_healthy
    ports:
      - "8080:8080"
    volumes:
      - careerpilot-data:/app/data
    restart: unless-stopped
    init: true
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp:size=128m,mode=1777

volumes:
  careerpilot-data:
  local-llm-cache:
